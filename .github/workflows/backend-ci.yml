name: Backend CI

on: 
  push:
    branches: [main]
  
jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: knowledge
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U ci -d knowledge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out Repository 
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Check backend files
        working-directory: backend
        run: ls -l pyproject.toml uv.lock

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.5'
          python-version: '3.14'
        
      - name: Install dependencies
        working-directory: backend
        run: | 
          uv sync --locked
          uv run --no-sync python --version
      
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci_test_only@127.0.0.1:5432/knowledge_test
          TEST_DATABASE_URL: postgresql+psycopg://ci:ci_test_only@127.0.0.1:5432/knowledge_test
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
        run: uv run --no-sync pytest -q
