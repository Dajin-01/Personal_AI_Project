name: Backend CI

on: 
  push:
    branches: [main]
  
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository 
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Check backend files
        working-directory: backend
        run: ls -l pyproject.toml uv.lock
